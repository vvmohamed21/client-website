<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1E36" />
    <title>Yönetim Girişi | AVETO</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      body { background: #f8f9fa; }
      .login-container {
        max-width: 420px;
        margin: 80px auto;
        padding: 40px;
        background: #ffffff;
        border-radius: 8px;
        border: 1px solid #e0e0e0;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }
      .login-header { text-align: center; margin-bottom: 30px; }
      .login-header h1 { color: #0B1E36; margin-bottom: 8px; font-size: 1.5rem; }
      .login-header p { color: #666; font-size: 0.95rem; }
      .form-group { margin-bottom: 18px; }
      .form-group label { display: block; font-weight: 600; color: #0B1E36; margin-bottom: 6px; }
      .form-group input {
        width: 100%; padding: 12px; border: 1px solid #e0e0e0;
        border-radius: 4px; font-size: 16px; box-sizing: border-box;
      }
      .form-group input:focus { outline: none; border-color: #0B1E36; }
      .btn {
        width: 100%; padding: 12px; border: none; border-radius: 4px;
        cursor: pointer; font-weight: 600; font-size: 15px;
        background: #0B1E36; color: #fff;
      }
      .btn:hover { background: #081729; }
      .error-message {
        background: #f8d7da; color: #721c24; padding: 12px;
        border-radius: 4px; margin-bottom: 16px; border: 1px solid #f5c6cb;
        display: none; font-size: 0.9rem;
      }
      .back-link { text-align: center; margin-top: 20px; }
      .back-link a { color: #0B1E36; text-decoration: none; font-weight: 600; }
      .hint { margin-top: 16px; font-size: 0.8rem; color: #888; text-align: center; }
      @media (max-width: 480px) {
        .login-container { margin: 24px 16px; padding: 28px 22px; }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="brand-mark" style="margin: 0 auto 16px;">A</div>
        <h1>Yönetim Paneli Girişi</h1>
        <p>Devam etmek için kullanıcı adı ve şifrenizi girin</p>
      </div>

      <div class="error-message" id="errorMessage">Kullanıcı adı veya şifre hatalı</div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Kullanıcı adı</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Şifre</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn">Giriş yap</button>
      </form>

      <div class="back-link"><a href="index.html">← Siteye dön</a></div>
      <p class="hint">Bu sayfa herkese açık değildir. Giriş bilgilerinizi yöneticinizden alın.</p>
    </div>

    <script>
      async function apiLogin(username, password) {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json().catch(() => ({}));
        return { ok: response.ok, data };
      }

      function offlineLogin(username, password) {
        const saved = localStorage.getItem('adminCredentials');
        const creds = saved ? JSON.parse(saved) : { username: 'admin', password: 'Anka2026!' };
        return username === creds.username && password === creds.password;
      }

      async function checkExistingSession() {
        try {
          const res = await fetch('/api/admin/check', { credentials: 'same-origin' });
          if (res.ok) { window.location.href = 'admin.html'; return true; }
        } catch { /* offline */ }
        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
          window.location.href = 'admin.html';
          return true;
        }
        return false;
      }

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('errorMessage');

        try {
          const result = await apiLogin(username, password);
          if (result.ok) {
            sessionStorage.setItem('adminLoggedIn', 'true');
            window.location.href = 'admin.html';
            return;
          }
        } catch {
          if (offlineLogin(username, password)) {
            sessionStorage.setItem('adminLoggedIn', 'true');
            window.location.href = 'admin.html';
            return;
          }
        }

        errorEl.style.display = 'block';
        setTimeout(() => { errorEl.style.display = 'none'; }, 3500);
      });

      checkExistingSession();
    </script>
  </body>
</html>
